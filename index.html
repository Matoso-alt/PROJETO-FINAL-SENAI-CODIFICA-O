
<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LancheLog</title>

    <!-- ligação de css e html -->

    <link rel="stylesheet" href="style.css">

</head>

<!-- inicio da parte visual ao usuario -->

<body>

    <!-- cabeçalho com informações de data e horario ficticios -->

    <header class="topo">

        <div class="identidade">

            <h1>Controle de Lanches</h1>

            <p>Sistema Digital de Distribuição</p>

        </div>

        <div class="data">

            16/11/2026&nbsp; 10:24

        </div>

    </header>

    <!-- atalho para seções de retirada, historico e painel de controle -->

    <div class="layout">

        <aside class="menu"> <!-- aside usado para a criação do menu lateral -->

            <nav> <!--Menu lateral de navegação-->
                <a class="ativo" href="#">Retirada de Lanche</a>
                <a href="#">Histórico</a>
                <a href="#">Painel de Controle</a>
            </nav>

        </aside>

        <main class="conteudo">

            <section class="cartao">

                <!-- uso da matricula para retirada -->

                <h2>Retirada de Lanche</h2>

                <section aria-labelledby="titulo-busca">

                    <label for="matricula">Matrícula do colaborador</label>

                            <div class="consulta">
                                <input
                                    type="text"
                                    id="matricula"
                                    placeholder="Digite a matrícula..."
                                >

                                <button type="button" onclick="consultar()">
                                    Consultar
                                </button>
                            </div>

                            <section class="resposta" aria-labelledby="titulo-resposta">

                                <h2>Resultado da consulta</h2>

                                <p id="nomeResultado"></p>
                                <p id="resultado" role="status" aria-live="polite">
                                    Digite a matrícula para começar.
                                </p>

                            </section>

                </section>

                <!--Informação do usuario após resutado da consulta ser aprovada-->

                <section class="resposta" aria-labelledby="titulo-resposta">
                    
              
                    <p id="nomeresultado"></p>
                    <p id="Resultado" role="status"></p>
                  
                  </section>

                <!--Botão para confirmar a entrega do lanche-->

                <button
                    class="confirmar"
                    id="confirmar"
                    type="button"
                    onclick="confirmarRetirada()"
                    disabled
                    >
                    Confirmar Entrega
                </button>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
